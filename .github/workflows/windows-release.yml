name: Windows release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build interface
        run: npm run build
      - name: Build installer and attach to GitHub Release
        run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Make release downloadable
        run: gh release edit $env:GITHUB_REF_NAME --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
